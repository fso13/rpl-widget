name: Update RPL table

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths:
      - docs/update.py
      - poster/matches.json
      - .github/workflows/update-rpl.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch table, schedule and scores
        run: python docs/update.py

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rpl.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh RPL 2026/27 table and scores"
            git push
          fi
