<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001a47">
  <meta name="description" content="Живая таблица, расписание и результаты Российской Премьер-Лиги 2026/27">
  <title>РПЛ 2026/27 — таблица и календарь</title>
  <link rel="icon" href="assets/rpl-bear.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <img src="assets/rpl-bear.png" alt="" width="48" height="48">
      <div>
        <p class="eyebrow">Альфа-Банк Российская Премьер-Лига</p>
        <h1>Сезон 2026/27</h1>
      </div>
    </div>
    <div class="status">
      <span id="updated">Загрузка…</span>
      <button type="button" id="reload" class="ghost">Обновить</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" id="tab-table" class="tab is-on" data-tab="table">Таблица</button>
    <button type="button" id="tab-matches" class="tab" data-tab="matches">Расписание</button>
    <button type="button" id="tab-results" class="tab" data-tab="results">Результаты</button>
  </nav>

  <main class="layout">
    <section class="panel table-panel" id="table-panel">
      <header class="panel-head">
        <h2>Турнирная таблица</h2>
        <p id="table-note">Очки · разница мячей · форма</p>
      </header>
      <div class="table-wrap">
        <table class="ladder">
          <thead>
            <tr>
              <th class="num">№</th>
              <th class="club">Клуб</th>
              <th>И</th>
              <th>В</th>
              <th>Н</th>
              <th>П</th>
              <th class="wide">Мячи</th>
              <th>±</th>
              <th>О</th>
              <th class="form-col">Форма</th>
            </tr>
          </thead>
          <tbody id="standings"></tbody>
        </table>
      </div>
      <ul class="legend">
        <li><i class="swatch euro"></i>1–3 еврокубки</li>
        <li><i class="swatch play"></i>13–14 стыки</li>
        <li><i class="swatch down"></i>15–16 вылет</li>
      </ul>
    </section>

    <section class="panel matches-panel" id="matches-panel">
      <header class="panel-head">
        <h2 id="matches-title">Календарь</h2>
        <div class="filters">
          <label class="sr">Команда
            <select id="team-filter">
              <option value="">Все клубы</option>
            </select>
          </label>
        </div>
      </header>
      <div id="live-strip" class="live-strip" hidden></div>
      <div id="tour-pills" class="pills"></div>
      <div id="match-list" class="match-list"></div>
    </section>
  </main>

  <footer class="foot">
    Данные с <a href="https://matchtv.ru/football/rpl/table" rel="noopener">Матч ТВ</a>.
    Таблица, счёт и расписание обновляются автоматически.
  </footer>
  <script src="app.js"></script>
</body>
</html>
